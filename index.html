      rel="stylesheet"
    />

    <!-- Prevent theme flash: apply saved/system theme before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mahmud-theme');
          var systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          // Default is dark; only fall back to light if no saved preference AND system explicitly prefers light.
          var theme = stored || (systemPrefersLight ? 'light' : 'dark');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
